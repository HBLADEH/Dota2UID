namespace = "dota2uid-local"
stratz_token = ""
timeout_seconds = 10
reply_mode = "image" # Set "text" for plain replies; errors always use text.
illustration_path = "" # Nonempty external pack takes precedence; relative to this file.
asset_download_mode = "auto" # auto / manual / off; complete managed snapshots are reused.
asset_proxy = "" # Optional explicit http(s)://host:port proxy, independent of STRATZ.
subscriptions_enabled = false
subscription_interval_seconds = 300
daily_report_hour = 9

# Map verified Event.bot_id values to platform namespaces; unknown platforms fail closed.
[platforms]
onebot = "qq"
qq = "qq"
telegram = "telegram"
